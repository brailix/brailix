# brailix CI — lint and type-check, unit tests on Linux and Windows, the
# generated API reference, and a wheel smoke test.
#
# The Pages deploy needs "Build and deployment → Source: GitHub Actions" set
# once in the repository settings; until then the publish job fails while
# everything else stays green.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        # Pinned to the full commit SHA: a tag — even a patch release like
        # v8.2.0 — is a movable ref, so only a commit SHA is an immutable
        # supply-chain anchor (per GitHub's secure-use guidance). The trailing
        # comment keeps the human-readable version; bump the SHA and comment
        # together. (setup-uv also stopped publishing floating major tags at v8.)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Mypy (type-check)
        run: uv run mypy brailix

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other OS when one fails — we want both results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Install every adapter the suite exercises so nothing skips: the light
      # Chinese engines (jieba / thulac / g2pM + numpy / pypinyin via ``zh``),
      # LaTeX math (latex2mathml), docx input (python-docx / lxml / olefile),
      # the music sources (mido / partitura / abc-xml-converter), tactile
      # graphics (Pillow decodes bitmaps, resvg rasterizes external SVGs), and
      # all three Japanese analyzers (janome / fugashi / sudachi). The `dev`
      # group (pytest etc.) comes in by default. Installing graphics matters
      # for coverage too: without it the tactile-graphics tests importorskip
      # and that whole vertical counts as uncovered.
      #
      # The two heavyweight neural Chinese engines — ``hanlp`` and ``g2pw`` —
      # are deliberately left OUT: no test here exercises their inference
      # (only path / error-string tests touch them) and they drag in torch.
      # Their coverage lives in the scheduled heavyweight-adapters workflow.
      # The known transformers hazard (5.0 removed BertTokenizer.encode_plus,
      # which hanlp calls at inference) is fenced twice: the ``hanlp`` extra
      # pins ``transformers<4.55``, and the adapter refuses to load under
      # transformers>=5 so the ``auto`` chain skips it instead of crashing.
      - name: Install dependencies
        run: >-
          uv sync
          --extra zh --extra thulac --extra g2pm --extra latex
          --extra docx --extra music --extra graphics --extra graphics-svg-raster
          --extra ja --extra fugashi --extra sudachi

      # Resolving an extra is not the same as being able to import it, and the
      # difference is invisible here: every adapter test is guarded by
      # ``importorskip``, so a wheel that installs but fails to load — a broken
      # binary extension, a data package that unpacked wrong — turns its tests
      # into SKIPPED and this job stays green while that adapter goes
      # unexercised. ``uv sync`` fails loudly on a resolution failure and says
      # nothing at all about this one.
      #
      # The five named are the ones where that silence would be total: each is
      # reached only through its own adapter, so nothing else in the suite
      # would notice its absence. The rest of the extras (docx, lxml, jieba,
      # pypinyin, Pillow) are load-bearing for hundreds of tests, which fail
      # rather than skip, so listing them here would only add ways for this
      # step to be wrong.
      - name: Verify the optional engines actually import
        run: >-
          uv run python -c
          "import fugashi, sudachipy, mido, partitura, abc_xml_converter;
          print('optional engines present')"

      # Branch-coverage gate. ``[tool.coverage.run]`` in pyproject already sets
      # ``branch = true`` and ``source = ["brailix"]``; here we fail the build
      # if a change drags core coverage below 94% (it currently sits around
      # 94.9%), so coverage can't silently erode. ``term-missing`` prints the
      # uncovered lines in the log for whoever has to close the gap.
      - name: Run the test suite
        run: >-
          uv run pytest
          --cov=brailix --cov-report=term-missing --cov-fail-under=94

  docs:
    name: API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      # Builds on every push AND every pull request, not only before a
      # deploy: the reference is generated from the docstrings, so a change
      # that breaks it (an unimportable facade module, a docstring pdoc
      # chokes on) is a change to the library, and it should fail in the PR
      # that made it rather than silently after merge.
      - name: Build the API reference
        run: >-
          uv run --group docs
          python scripts/build_docs.py --output-dir site

      - name: Upload the reference as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  # Publishing is split from building so the build can run on pull requests
  # from forks with no permissions at all, while only a push to the default
  # branch gets the write-scoped token that can deploy.
  #
  # It is scoped to the repository that owns the published site as well,
  # because the same commits reach more than one remote — a fork, or a copy
  # that tracks this repository commit for commit — while Pages is enabled on
  # exactly one of them. Everywhere else this job ended every push to main
  # with "Failed to create deployment (status: 404) ... Ensure GitHub Pages
  # has been enabled", and nothing was actually wrong: lint, both test
  # matrices, the wheel smoke test and the reference build itself all passed,
  # and only the deploy of a site that repository doesn't publish failed. A
  # main branch that is *expected* to be red is worse than no signal at all,
  # so the job is skipped where it cannot apply instead of failing there.
  publish-docs:
    name: publish the API reference
    needs: docs
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.repository == 'brailix/brailix'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  wheel:
    name: wheel build + clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel

      # Install the built wheel into a fresh, dependency-free venv (no dev
      # group, no extras) and drive the CLI. This catches packaging faults the
      # editable dev install hides: a missing entry point, or profile /
      # resource JSON left out of the wheel (a bare core install must still
      # load a profile and translate). Number-only input needs no optional
      # adapter, so the core wheel alone must render it end to end.
      - name: Clean-install the wheel and smoke-test the CLI
        run: |
          uv venv --python 3.13 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/brailix --version
          /tmp/smoke/bin/brailix --list-profiles
          out=$(/tmp/smoke/bin/brailix "123" --profile cn_current)
          printf 'translated output: %s\n' "$out"
          test -n "$out"
