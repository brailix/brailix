# Scheduled smoke test for the heavy neural Chinese engines (hanlp, g2pw) that
# the main CI deliberately skips — they pull in PyTorch, download models on
# first use, and hanlp is currently incompatible with recent transformers.
#
# This job does NOT block pull requests: it runs weekly (and on demand),
# installs each engine independently, loads its model once and runs a minimal
# inference through the public Pipeline API, and opens an issue if one can no
# longer load / infer. So a regression (or a fix) is noticed without every
# ordinary PR paying the multi-gigabyte install. Each engine is a separate
# matrix leg (fail-fast: false) so one being broken never masks the other.
name: Heavyweight adapters

on:
  schedule:
    # Mondays 06:00 UTC — a low-traffic window; adjust freely.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: ${{ matrix.adapter }} (${{ matrix.kind }})
    # Upstream only. A fork inherits this file and its schedule, so it runs the
    # same multi-gigabyte install on its own clock for a result nobody reads —
    # and the failure step below cannot even file its issue, because a fork
    # normally has Issues disabled, so every red run reds twice for two
    # unrelated reasons. Guarding the job (rather than switching the schedule
    # off by hand in each fork's settings) keeps the answer in the file.
    if: github.repository == 'brailix/brailix'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One engine being broken must not cancel the other's result.
      fail-fast: false
      matrix:
        include:
          - adapter: hanlp
            kind: analyzer
          - adapter: g2pw
            kind: resolver
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install brailix + ${{ matrix.adapter }}
        run: uv sync --extra ${{ matrix.adapter }} --extra zh

      - name: Load model + minimal inference
        env:
          ADAPTER: ${{ matrix.adapter }}
          KIND: ${{ matrix.kind }}
        run: |
          uv run python - <<'PY'
          import os

          from brailix import Pipeline
          from brailix.core.context import FrontendContext
          from brailix.frontend import tokenize_zh

          SENTENCE = "我在重庆"
          BLANK = "⠀"  # the empty braille cell
          name, kind = os.environ["ADAPTER"], os.environ["KIND"]

          # Each leg asserts what its own engine CONTRIBUTES, which is not the
          # same question for the two kinds — and asking the easy question
          # instead is how this job stayed green on a broken engine for weeks.
          # It used to run both legs through the Pipeline and `assert out`,
          # i.e. "the render is a non-empty string". A resolver that loads but
          # produces no readings renders as blank cells, and a string of blank
          # cells is non-empty, so g2pw passed while emitting output identical
          # to `resolver="null"` — the one thing it must never be mistaken for.
          if kind == "analyzer":
              # An analyzer's contribution is the segmentation, and pairing it
              # with the null resolver (so this leg never downloads g2pw's
              # model) means the braille is legitimately all blank here. So
              # look at the tokens instead: they must cover the input exactly,
              # and at least one merge must have happened — a fallback to
              # per-character segmentation returns one token per character.
              ctx = FrontendContext(
                  profile="cn_current", options={"zh_analyzer": name}
              )
              tokens = tokenize_zh(SENTENCE, ctx)
              surfaces = [t.surface for t in tokens]
              assert "".join(surfaces) == SENTENCE, (
                  f"{name}: tokens {surfaces} do not reconstruct {SENTENCE!r}"
              )
              assert len(tokens) < len(SENTENCE), (
                  f"{name}: {len(tokens)} tokens for {len(SENTENCE)} characters "
                  f"({surfaces}) — nothing was merged, which is what a silent "
                  f"fallback to character segmentation looks like"
              )
              detail = "/".join(surfaces)
          else:
              # A resolver's contribution is the readings, and readings are
              # exactly what turns blank cells into braille.
              result = Pipeline(
                  profile="cn_current", analyzer="char", **{kind: name}
              ).translate_text(SENTENCE)
              out = result.render()
              assert out, f"{name}: empty braille output"
              assert set(out) - {BLANK}, (
                  f"{name}: every cell is blank (U+2800), which is byte-for-byte "
                  f"what resolver='null' produces — the engine loaded but "
                  f"contributed no readings"
              )
              codes = sorted({w.code for w in result.warnings})
              assert not codes, (
                  f"{name}: translation raised {codes} — a reading that misaligns "
                  f"is reported as a warning and then dropped, so a clean render "
                  f"is not on its own evidence that the engine worked"
              )
              detail = out

          print(f"OK {name} ({kind}): {detail}")
          PY

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const adapter = process.env.ADAPTER;
            const label = "heavyweight-adapter-ci";
            const title = `Heavyweight adapter smoke failing: ${adapter}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled smoke test for the \`${adapter}\` extra failed`,
              `(model load or minimal inference through the public Pipeline API).`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `This engine is experimental — it pulls in PyTorch and downloads a`,
              `model on first use, so the main CI does not exercise it. Pull requests`,
              `are not blocked by this job. Close this issue once the engine loads and`,
              `infers again; the next scheduled run reopens one if it is still broken.`,
            ].join("\n");
            // Dedupe: if an open issue for this adapter already exists, leave it
            // be (don't spam a weekly comment) — its mere openness says "still
            // broken". Only file one when none is open.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 100,
            });
            if (open.data.some((i) => i.title === title)) {
              core.info(`An open issue for ${adapter} already exists; not filing another.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
        env:
          ADAPTER: ${{ matrix.adapter }}
